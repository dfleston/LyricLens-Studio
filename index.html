
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyricLens: Video Storyboarder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .mermaid-container svg {
            max-width: 100%;
            height: auto;
        }

        /* Print Engine Configuration */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0; /* Let internal container handle padding */
            }
            body, html {
                background-color: white !important;
                color: black !important;
                overflow: visible !important;
                height: auto !important;
                width: 100% !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            /* Hide the root app structure and navigation */
            #root > div > header, 
            #root > div > main,
            .no-print {
                display: none !important;
                height: 0 !important;
                visibility: hidden !important;
            }
            
            /* Show only the print-only container */
            .print-only {
                display: block !important;
                visibility: visible !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                background: white !important;
                color: black !important;
                padding: 1.5cm !important;
                box-sizing: border-box !important;
            }
            
            .storyboard-strip {
                border-bottom: 2px solid #e2e8f0 !important;
                padding-bottom: 3rem !important;
                margin-bottom: 3rem !important;
                page-break-inside: avoid !important;
                display: block !important;
            }
            
            .bg-gray-50 { background-color: #f8fafc !important; }
            .border-gray-100 { border-color: #e2e8f0 !important; }
            .text-blue-600 { color: #2563eb !important; }
            .text-gray-400 { color: #94a3b8 !important; }
            .text-gray-600 { color: #475569 !important; }
            .text-gray-700 { color: #334155 !important; }
            .text-gray-900 { color: #0f172a !important; }
            
            img {
                max-width: 100% !important;
                border-radius: 0.5rem !important;
                display: block !important;
            }
        }
        
        /* Web-view only for print container */
        .print-only {
            display: none;
        }

        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }
        ::-webkit-scrollbar-track {
          background: #020617;
        }
        ::-webkit-scrollbar-thumb {
          background: #1e293b;
          border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #334155;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "mermaid": "https://esm.sh/mermaid@^11.12.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
